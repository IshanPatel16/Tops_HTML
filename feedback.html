<html>

<head>
    <title>Feedback</title>
</head>

<body>

    <h1>Feedback Form</h1>

    <form>

        <label>Name</label>
        <input type="text" required placeholder="Enter your name" autofocus>

        <br><br>

        <label>Email</label>
        <input type="email" required placeholder="@gmail.com">

        <br><br>

        <label>How was your experience? </label>
        <br>

        Avg:<input type="radio" required name="option" value="avg"> 
		Good:<input type="radio" required name="option" value="good">
		Best:<input type="radio" required name="option" value="best">
        <br><br>
        <label>Write your feedback</label>
        <br>

        <textarea required ></textarea>

        <br><br>

        <button>Submit</button>
		<button>Reset</button>

    </form>

</body>

</html>
